schema_version: 1
objective: one_installable_skill_with_legacy_quality_parity
quality_policy:
  allow_quality_reduction: false
  require_real_end_to_end_comparison: true
  required_rounds: [R1, R2, R3]

capabilities:
  orchestration_and_stage_gates:
    status: embedded
    embedded_paths:
      - workflows/overseas_energy_research.workflow.yaml
      - scripts/run_workflow.py
      - scripts/validate_stage_gate.py
      - scripts/regression_test_workflow_runner.py
    parity_contract:
      - --all one-command pipeline: init -> check(0-4) -> collect -> modeling -> build-final-report -> audit
      - --collect mechanical execution of 02_Web_Collection_Tasks.csv with auto-journaling
      - --modeling scripted chain steps; human gates (G2.5/G4.5) reported as pending, never self-approved
      - --dry-run preview without execution

  market_insight_five_views:
    status: embedded
    legacy_external_skills: [market-insight]
    embedded_paths:
      - references/market-insight-five-views.md
      - references/market-insight-report-contract.md
      - scripts/validate_market_insight.py

  excel_generation_recalculation_and_qa:
    status: embedded
    legacy_external_skills: [excel-master, xlsx]
    embedded_paths:
      - scripts/sync_csv_to_excel.py
      - scripts/style_excel_consulting.py
      - scripts/recalculate_excel.py
      - scripts/validate_excel_delivery.py
      - scripts/regression_test_excel_delivery.py
    parity_contract:
      - light default and jade consulting themes
      - Arial 11, professional formats, formula/value color distinction
      - horizontal-only table rules, filters, freeze panes, widths, print QA
      - formulas and cell values preserved by the styling pass

  office_pdf_page_rendering:
    status: embedded
    embedded_paths:
      - scripts/libreoffice_render.py
      - scripts/create_page_contact_sheet.py
      - scripts/scan_office_placeholders.py
    python_dependencies: [PyMuPDF]

  web_collection:
    status: embedded
    legacy_external_skills: [anysearch, kimi-webbridge]
    embedded_paths:
      - scripts/anysearch/anysearch_cli.py
      - scripts/anysearch/shared/constants.json
      - scripts/anysearch/shared/doc_spec.md
      - scripts/anysearch/README_embedded.md
      - scripts/_kimi_webbridge.py
      - scripts/web_collection/__init__.py
      - scripts/web_collection/errors.py
      - scripts/web_collection/journal.py
      - scripts/web_collection/anysearch_backend.py
      - scripts/web_collection/http_fetch.py
      - scripts/web_collection/kimi_adapter.py
      - scripts/web_collection/router.py
      - scripts/web_collection/cli.py
      - scripts/validate_collection_attempts.py
      - scripts/regression_test_anysearch_embed.py
      - scripts/regression_test_kimi_embed.py
      - scripts/regression_test_web_collection.py
      - references/kimi-webbridge-operations.md
      - references/kimi-webbridge-client-contract.md
      - references/kimi-webbridge-collection-playbooks.md
    parity_contract:
      - anysearch CLI is the official 3.0.1 source copied verbatim (zero diff, same hashes); full command surface preserved
      - kimi-webbridge client payloads are field-for-field identical to the official curl examples; official SKILL.md and operations.md embedded verbatim
      - one unified CLI (doctor/search/batch-search/extract/browse/auth-check/journal-summary) with attempt journal and raw captures
      - R1/R2/R3 quantity floors and completion contracts enforced by the frozen policy validators
      - anti-under-collection and anti-fake-completion gates in validate_collection_attempts.py
      - offline regression tests for the anysearch command surface, kimi contract, and the end-to-end flow
    runtime_external_components:
      - anysearch API service at https://api.anysearch.com/mcp (optional API key: --api_key > .env > env var > anonymous)
      - kimi-webbridge daemon at ~/.kimi-webbridge/bin/ plus the browser extension (like LibreOffice: external desktop runtime; auto-start and diagnostics embedded)
    regression_tests:
      - regression_test_anysearch_embed.py: PASS
      - regression_test_kimi_embed.py: PASS
      - regression_test_web_collection.py: PASS
    live_smoke_2026_08_10:
      - "anysearch real API search: PASS (real results returned, raw capture saved)"
      - "kimi real daemon v1.11.3 + extension 1.11.5 navigate/snapshot: PASS"
      - "kimi auth check on real pages: example.com logged_in, github.com/login logged_out -> PASS"
      - "real-envelope {ok,data} discovered and unwrapped in kimi_adapter (documentation examples are top-level fields)"
      - "tags closed after smoke"

  mathematical_modeling:
    status: embedded
    legacy_external_skills:
      - problem-parser
      - problem-classifier
      - related-paper-analyzer
      - symbol-table-builder
      - model-assumptions-builder
      - method-selector
      - decision-prompt-builder
      - data-auditor-cleaner
      - model-code-analyzer
      - python-model-code-generator
      - matlab-model-code-generator
      - code-reviewer
      - python-code-reviewer
      - matlab-code-reviewer
      - result-report-generator
      - robustness-checker
      - final-method-explainer
      - figure-table-planner
      - solution-package-builder
