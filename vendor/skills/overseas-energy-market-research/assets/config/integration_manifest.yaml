    embedded_paths:
      - references/modeling_chain/README_embedded.md
      - references/modeling_chain/problem-parser.md
      - references/modeling_chain/problem-classifier.md
      - references/modeling_chain/related-paper-analyzer.md
      - references/modeling_chain/symbol-table-builder.md
      - references/modeling_chain/model-assumptions-builder.md
      - references/modeling_chain/method-selector.md
      - references/modeling_chain/decision-prompt-builder.md
      - references/modeling_chain/data-auditor-cleaner.md
      - references/modeling_chain/model-code-analyzer.md
      - references/modeling_chain/python-model-code-generator.md
      - references/modeling_chain/matlab-model-code-generator.md
      - references/modeling_chain/code-reviewer.md
      - references/modeling_chain/python-code-reviewer.md
      - references/modeling_chain/matlab-code-reviewer.md
      - references/modeling_chain/result-report-generator.md
      - references/modeling_chain/robustness-checker.md
      - references/modeling_chain/final-method-explainer.md
      - references/modeling_chain/figure-table-planner.md
      - references/modeling_chain/math-figure-generator.md
      - references/modeling_chain/references/chart-patterns.md
      - references/modeling_chain/references/color-systems.md
      - references/modeling_chain/references/layout-guide.md
      - references/modeling_chain/solution-package-builder.md
      - references/modeling_chain/consistency-auditor.md
      - references/modeling_chain/completeness-auditor.md
      - references/modeling_chain/quality-assurance-auditor.md
      - references/modeling_chain/modeler-decision-logger.md
      - references/modeling-chain-adaptation.md
      - scripts/create_modeling_artifacts.py
      - scripts/validate_model_integrity.py
      - scripts/validate_modeling_chain_gates.py
      - scripts/regression_test_modeling_chain.py
    parity_contract:
      - 24 skill instruction docs embedded verbatim (MIT, zero diff from originals; math-figure-generator references included)
      - G1/G2/G3/G6 mechanical gates scripted; G2.5/G4.5 human gates and G4 frozen freshness enforced
      - human gates can never be self-approved by AI (decided_by=human required)
      - market data gaps stay gaps; missing modeling inputs use reproducible simulated data (12/14, value_class=simulated)
      - 12/13/14 CSVs written only by create_modeling_artifacts.py
      - benchmark, sensitivity, robustness and error analysis not skippable
    regression_tests:
      - regression_test_modeling_chain.py: PASS (14/14)

  word_production:
    status: embedded
    legacy_external_skills: [kami, docx]
    embedded_paths:
      - scripts/build_template_report.py
      - scripts/polish_word_ib_style.py
      - scripts/verify_word_ib_style.py
      - scripts/validate_word_delivery.py
      - scripts/libreoffice_render.py
      - scripts/scan_office_placeholders.py
      - scripts/register_word_delivery.py
      - assets/templates/word/energy_market_research_report_template.docx
    parity_contract:
      - fused broker-template lineage and exact typography
      - deterministic IB-style cleanup and structural gates
      - three-line tables, inline figures, captions, source notes, and page fields
      - exactly one unique caption immediately before each report table; duplicate or orphan captions fail final validation
      - bounded full-page rendering and explicit all-page inspection registration

  figure_production:
    status: embedded
    legacy_external_skills: [nature-figure, math-figure-generator]
    embedded_paths:
      - scripts/figure_production.py
      - scripts/render_charts.py
      - scripts/render_figure_from_spec.py
      - scripts/build_text_only_demo_specs.py
      - scripts/replace_word_figures.py
      - scripts/chart_polish.py
      - scripts/validate_figure_delivery.py
      - scripts/register_figure_delivery.py
      - scripts/insert_approved_figures.py
      - scripts/regression_test_figure_delivery.py
      - scripts/regression_test_text_only_visuals.py
      - scripts/kami_broker_chart_theme.py
      - references/chart-polish-and-variety.md
      - references/text-only-chart-and-slide-design.md
      - assets/templates/json/figure_spec_template.json
    parity_contract:
      - claim-first figure contract and one embedded owner per figure
      - Python-only editable SVG plus 300-dpi PNG output
      - source, generator, and output hashes in every theme manifest
      - mechanical render checks plus explicit visual-inspection registration
      - deterministic relationship-driven chart routing for text-only models; final 6+ figure sets cap bar-family share at 60% and require 3+ chart families
      - every canonical chart type may appear at most twice in any final figure set; aliases are counted together
      - deterministic text-only visual QA replaces unavailable multimodal inspection; visually similar single-axis comparison grammars are capped as one family
      - market gaps remain gaps; missing modeling inputs use traceable realistic simulation

  presentation_production:
    status: embedded_full_parity
    legacy_external_skills: [ppt-master, pptx, ewo-image-generate]
    embedded_paths:
      - scripts/high_fidelity_presentation.py
      - scripts/project_manager.py
      - scripts/svg_editor/server.py
      - scripts/svg_quality_checker.py
      - scripts/total_md_split.py
      - scripts/finalize_svg.py
      - scripts/svg_to_pptx.py
      - scripts/pptx_animations.py
      - scripts/validate_high_fidelity_ppt_delivery.py
      - scripts/register_high_fidelity_ppt_delivery.py
      - scripts/build_presentation_evidence_map.py
      - scripts/validate_presentation_delivery.py
      - scripts/presentation_production.py
      - scripts/resolve_presentation_images.py
      - scripts/build_executive_presentation.py
      - scripts/validate_ppt_delivery.py
      - scripts/register_ppt_delivery.py
      - scripts/regression_test_ppt_delivery.py
      - scripts/libreoffice_render.py
      - scripts/create_page_contact_sheet.py
      - references/text-only-chart-and-slide-design.md
      - templates/design_spec_reference.md
      - templates/spec_lock_reference.md
      - templates/charts/
      - templates/layouts/
      - templates/decks/
      - templates/brands/
      - templates/icons/
      - assets/templates/json/presentation_plan_template.json
      - assets/templates/json/presentation_image_requests_template.json
    parity_contract:
      - eight bundled user confirmations before design_spec and spec_lock
      - current main agent hand-writes SVG pages sequentially and rereads spec_lock before every page
      - no sub-agent SVG generation and no script-batched page generation
      - live SVG preview, annotations, quality checking, notes, post-processing, and native DrawingML export
      - editable text and shapes plus transitions, semantic entrance animations, narration support, and conversion trace
      - complete embedded chart, layout, deck, brand, and icon libraries
      - answer-first titles, consulting layouts, source/update/limitation footers, and speaker notes
      - approved report figures are reused; slide-only frameworks remain editable native vectors
      - EWO produces cover and optional body raster illustrations when available
      - insufficient balance or another normalized EWO failure triggers a light consulting cover and handwritten-SVG vector body fallback
      - every slide is rendered with LibreOffice and PyMuPDF, inspected, fixed, rerendered, and registered by final hash
      - Python-native build_executive_presentation renderer is fallback-only and cannot be claimed as equivalent
