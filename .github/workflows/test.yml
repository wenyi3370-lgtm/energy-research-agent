name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[full,test]"
      - name: Install Chrome for headless diagram PNG rendering
        # ubuntu-latest ships a snap-wrapper chromium that cannot render in
        # the runner; replace it with Google Chrome so chart rasterization
        # (diagram_design_adapter.py) works deterministically.
        run: >
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          && sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y
          && sudo rm -f /usr/bin/chromium /usr/bin/chromium-browser
          && sudo ln -s /usr/bin/google-chrome /usr/local/bin/chromium
      - name: Unit, integration and recorded-fixture tests
        run: python -m unittest discover -s tests -v
      - name: Content regression gates (identity / query context / normalization / content / Kimi / adaptive rounds / visual freeze)
        run: >
          python -m unittest tests.test_identity_verification tests.test_extraction_contract
          tests.test_field_registry tests.test_content_gates tests.test_pipeline_trace
          tests.test_kimi_image_discovery tests.test_catalog_synthesis
          tests.test_opportunity_engine tests.test_adaptive_rounds tests.test_no_hardcoding
          tests.test_visual_regression -v
      - name: Recorded research accuracy eval (golden labels, Unsupported Claim Rate = 0)
        run: python scripts/run_recorded_research_eval.py --output build/evals/recorded_research_eval.json
      - name: Automation eval
        run: python scripts/run_automation_eval.py
      - name: Embedded vendor manifest
        run: python scripts/vendor_skills.py verify
      - name: JSON and schema syntax
        run: python -c "import json,pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('schemas').glob('*.json')]"
      - name: Docker build
        run: docker build -t enterprise-energy-research:${{ github.sha }} .

  # Live browser / API acceptance is high-cost external-call work: manual only.
  live-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[full,test]"
      - name: Live acceptance (default company)
        env:
          EER_DEEPSEEK_API_KEY: ${{ secrets.EER_DEEPSEEK_API_KEY }}
          EER_OPENAI_API_KEY: ${{ secrets.EER_OPENAI_API_KEY }}
        run: python scripts/run_live_acceptance.py --company 宁德时代
