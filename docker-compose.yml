# Energy Research Agent v0.9.0 — full stack
#   research-api  : FastAPI application service
#   postgres      : automation control-plane database
#   n8n           : optional scheduled intelligence/failure watchdog (profile: automation)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or a Docker secret}
      POSTGRES_DB: research
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research"]
      interval: 5s
      timeout: 3s
      retries: 10

  research-api:
    build: .
    restart: unless-stopped
    environment:
      ERA_AUTOMATION_DATABASE_URL: postgresql+psycopg://research:${POSTGRES_PASSWORD}@postgres:5432/research
      ERA_AUTOMATION_WORKDIR: /data/automation_work
      # Execute the mounted Agent source so local edits are visible after restart.
      PYTHONPATH: /skill/src
      ERA_SKILL_ROOT: /skill
      ERA_DESKTOP_PATH: /desktop
      # Run mode: synthetic (offline smoke test) | orchestrating (real Agent run)
      ERA_AUTOMATION_EXECUTOR: ${ERA_AUTOMATION_EXECUTOR:-orchestrating}
      # New installations do not run scheduled intelligence unless enabled explicitly.
      ERA_INTELLIGENCE_CATCHUP: ${ERA_INTELLIGENCE_CATCHUP:-off}
      # LLM gateway for real extraction (至少配置一个 provider):
      ERA_DEEPSEEK_API_KEY: ${ERA_DEEPSEEK_API_KEY:-}
      ERA_DEEPSEEK_API_BASE: ${ERA_DEEPSEEK_API_BASE:-}
      ERA_PRIMARY_MODEL: ${ERA_PRIMARY_MODEL:-}
      ERA_OPENAI_API_KEY: ${ERA_OPENAI_API_KEY:-}
      ERA_OPENAI_API_BASE: ${ERA_OPENAI_API_BASE:-}
      ERA_FALLBACK_MODEL: ${ERA_FALLBACK_MODEL:-}
      ERA_OUTBOUND_PROXY: ${ERA_OUTBOUND_PROXY:-}
      # Vision pixel verification stays on the native DeepSeek vision model
      # (dedicated credentials; research gateway may point elsewhere).
      ERA_VISION_API_KEY: ${ERA_VISION_API_KEY:-}
      ERA_VISION_API_BASE: ${ERA_VISION_API_BASE:-}
      ERA_ANYSEARCH_API_KEY: ${ERA_ANYSEARCH_API_KEY:-}
      # ERA_OPENAI_API_KEY: ""
      # Kimi WebBridge browser session (daemon runs on host, port 10086).
      # Do not reuse the local ERA_KIMI_WEB_DAEMON_URL here: 127.0.0.1 inside
      # a container is the container itself. Override the Docker-specific value
      # only when the daemon is reachable at another container-visible URL.
      ERA_KIMI_WEB_SESSION: ${ERA_KIMI_WEB_SESSION:-default}
      ERA_KIMI_WEB_DAEMON_URL: ${ERA_DOCKER_KIMI_WEB_DAEMON_URL:-http://host.docker.internal:10086}
      # Optional Feishu notifications:
      ERA_FEISHU_APP_ID: ${ERA_FEISHU_APP_ID:-}
      ERA_FEISHU_APP_SECRET: ${ERA_FEISHU_APP_SECRET:-}
      # 接收人：飞书邮箱 / open_id / chat_id（未配置则通知 fail-closed，可后续补）
      ERA_FEISHU_DEFAULT_RECEIVER: ${ERA_FEISHU_DEFAULT_RECEIVER:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - research-data:/data/automation_work
      # 宿主机仓库（源码只读 + live 调查产物可写）
      - type: bind
        source: .
        target: /skill
      # Cross-platform export path; override ERA_EXPORT_PATH in .env when needed.
      - type: bind
        source: ${ERA_EXPORT_PATH:-./outputs}
        target: /desktop
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  n8n:
    profiles: ["automation"]
    image: n8nio/n8n:2.35.4
    restart: unless-stopped
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: 5678
      TZ: Asia/Shanghai
      GENERIC_TIMEZONE: Asia/Shanghai
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - research-api

volumes:
  pgdata:
  research-data:
  n8n-data:
