# Enterprise Energy Research v0.9.0 — full stack
#   research-api  : FastAPI application service
#   postgres      : automation control-plane database
#   n8n           : daily intelligence + failure watchdog; research starts only in local portal
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or a Docker secret}
      POSTGRES_DB: research
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research"]
      interval: 5s
      timeout: 3s
      retries: 10

  research-api:
    build: .
    restart: unless-stopped
    environment:
      EER_AUTOMATION_DATABASE_URL: postgresql+psycopg://research:${POSTGRES_PASSWORD}@postgres:5432/research
      EER_AUTOMATION_WORKDIR: /data/automation_work
      # 宿主机仓库挂载点：继续深度研究可在 /skill/build/live_acceptance 下
      # 定位历史 live 调查的证据库与产物。
      EER_SKILL_ROOT: /skill
      # 宿主机桌面挂载点：save_to_desktop 时把 Word/HTML/Excel 复制到这里。
      EER_DESKTOP_PATH: /desktop
      # Run mode: synthetic (default, zero-config) | orchestrating (real research)
      EER_AUTOMATION_EXECUTOR: orchestrating
      # LLM gateway for real extraction (至少配置一个 provider):
      EER_DEEPSEEK_API_KEY: ${EER_DEEPSEEK_API_KEY:-}
      # EER_OPENAI_API_KEY: ""
      # Kimi WebBridge browser session (daemon runs on host, port 10086):
      EER_KIMI_WEB_SESSION: default
      # 容器内经 host.docker.internal 访问宿主机 daemon（浏览器扩展已连接）
      EER_KIMI_WEB_DAEMON_URL: http://host.docker.internal:10086
      # Optional Feishu notifications:
      EER_FEISHU_APP_ID: ${EER_FEISHU_APP_ID:-}
      EER_FEISHU_APP_SECRET: ${EER_FEISHU_APP_SECRET:-}
      # 接收人：飞书邮箱 / open_id / chat_id（未配置则通知 fail-closed，可后续补）
      EER_FEISHU_DEFAULT_RECEIVER: ${EER_FEISHU_DEFAULT_RECEIVER:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - research-data:/data/automation_work
      # 宿主机仓库（源码只读 + live 调查产物可写）
      - type: bind
        source: .
        target: /skill
      # 宿主机桌面：deep-research 的「保存到桌面」
      - type: bind
        source: ${EER_DESKTOP_PATH:-~/Desktop}
        target: /desktop
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  n8n:
    # Must match the migration level of the persisted n8n-data volume.
    image: n8nio/n8n:2.35.4
    restart: unless-stopped
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: 5678
      TZ: Asia/Shanghai
      GENERIC_TIMEZONE: Asia/Shanghai
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - research-api

volumes:
  pgdata:
  research-data:
  n8n-data:
