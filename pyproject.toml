[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-research-agent"
version = "0.9.0"
description = "Agentic energy and enterprise research with evidence recovery and governed publication"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6,<7",
  "Pillow>=10,<13",
  "python-docx>=1.1,<2",
  # Required by the bundled AnySearch runtime and Excel publisher.
  "requests>=2.31,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
orchestration = ["langgraph>=0.2,<2"]
models = ["litellm>=1.40,<2"]
database = ["SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.1,<4"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "jsonschema>=4.23,<5"]
render = ["PyMuPDF>=1.24,<2"]
# Primary browser-rasterization path for figure PNGs. A fresh local install
# must also run `playwright install chromium`; Docker uses system Chromium.
visual = ["playwright==1.60.0"]
full = [
  "langgraph>=0.2,<2",
  "litellm>=1.40,<2",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.1,<4",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "PyMuPDF>=1.24,<2",
  "playwright==1.60.0",
]

[project.scripts]
energy-research-agent = "energy_research_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
