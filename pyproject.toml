[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-energy-research"
version = "0.8.1"
description = "Evidence-first enterprise industry and energy cooperation research workflow"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6,<7",
  "Pillow>=10,<13",
  "python-docx>=1.1,<2",
  # vendor runtime deps (previously ambient; required by anysearch CLI
  # python runtime and the excel-master embedded publisher)
  "requests>=2.31,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
]

[project.optional-dependencies]
orchestration = ["langgraph>=0.2,<2"]
models = ["litellm>=1.40,<2"]
database = ["SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.1,<4"]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]
render = ["PyMuPDF>=1.24,<2"]
full = [
  "langgraph>=0.2,<2",
  "litellm>=1.40,<2",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.1,<4",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "PyMuPDF>=1.24,<2",
]

[project.scripts]
enterprise-energy-research = "enterprise_energy_research.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
