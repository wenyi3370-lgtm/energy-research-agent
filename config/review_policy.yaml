# Automatic adjudication policy. Human-review triggers are disabled: warnings,
# low confidence and conflicts are preserved in the audit trail while the most
# credible supported option is selected and execution continues.
schema_version: "1.0"
rules:
  RV-01_pass_with_warnings:
    enabled: false
    reason: "validation warning retained for automatic adjudication audit"
  RV-02_low_confidence:
    enabled: false
    min_confidence: 0.70
    reason: "model confidence {confidence} is below {min_confidence}"
  RV-03_high_risk:
    enabled: false
    min_risk: "HIGH"
    reason: "risk level is {risk_level}"
  RV-04_conflicts:
    enabled: false
    reason: "{conflict_count} conflicting claims were automatically adjudicated"
  RV-05_gaps:
    enabled: false
    reason: "{gap_count} open evidence gaps need acceptance"
  RV-06_low_evidence:
    enabled: false
    min_evidence: 10
    reason: "only {evidence_count} evidence records; below {min_evidence}"
  RV-07_executor_reasons:
    enabled: false
    reason: "executor reported: {first_reason}"
  RV-08_market_scope:
    enabled: false
    reason: "market-level scope without a named company"
  RV-09_sensitive_types:
    enabled: false
    research_types: ["policy_regulation", "channel_research"]
    reason: "research type {research_type} is policy-sensitive"
  RV-10_urgent_priority:
    enabled: false
    reason: "priority {priority} requires senior sign-off"
